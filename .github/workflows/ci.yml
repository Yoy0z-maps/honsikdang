name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Format, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Migrations apply from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Only Postgres is needed to verify migrations; uses the CLI version
      # pinned in package-lock.json.
      - run: npx supabase db start
      - run: npx supabase db reset
      # Lints our schemas only; the `extensions` schema holds third-party
      # PostGIS functions that plpgsql_check flags as false positives.
      - run: npm run db:lint
      # pgTAP authorization matrix (supabase/tests).
      - run: npm run db:test
      # Generated types must match the migrated schema.
      - run: npm run db:types
      - run: git diff --exit-code -- lib/supabase/database.types.ts
      - if: always()
        run: npx supabase stop --no-backup

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
