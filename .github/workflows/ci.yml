name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Format, typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Migrations apply from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Only Postgres is needed to verify migrations; uses the CLI version
      # pinned in package-lock.json.
      - run: npx supabase db start
      - run: npx supabase db reset
      # Lints our schemas only; the `extensions` schema holds third-party
      # PostGIS functions that plpgsql_check flags as false positives.
      - run: npm run db:lint
      # pgTAP authorization matrix (supabase/tests).
      - run: npm run db:test
      # Generated types must match the migrated schema.
      - run: npm run db:types
      - run: git diff --exit-code -- lib/supabase/database.types.ts
      - if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: Mobile e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # API gateway, PostgREST, Auth and Postgres (+ seed.sql) only.
      - run: npx supabase start -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Write local Supabase env
        run: |
          npx supabase status -o env \
            | grep -E '^(API_URL|PUBLISHABLE_KEY)=' \
            | sed -E 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' \
            > .env.local
          test "$(wc -l < .env.local)" -eq 2
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
